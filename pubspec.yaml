name: gym_log
description: GymLog UTS Praktikum dengan JSON lokal dan pilihan integrasi API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  shared_preferences: 2.5.3
  # Tetap memakai implementasi Android yang kompatibel dengan Flutter 3.24+.
  shared_preferences_android: 2.3.4
  html: ^0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/exercises.json
